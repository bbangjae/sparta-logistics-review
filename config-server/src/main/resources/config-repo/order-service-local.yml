server:
  port: ${ORDER_SERVICE_PORT}

management:
  endpoints:
    web:
      exposure:
        include: refresh

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/order_db
    username: postgres
    password: 123
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBIT_USERNAME:guest}
    password: ${RABBIT_PASSWORD:guest}
  cache:
    type: redis
    redis:
      time-to-live: 3600s
  data:
    redis:
      host: localhost
      port: 6379

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE}
    register-with-eureka: true
    fetch-registry: true

mq:
  order:
    queue:
      delivery:
        created: order.queue.delivery.created
        completed: order.queue.delivery.completed
    exchange: order.exchange
    routing_key:
      delivery:
        created: order.delivery.created
        completed: order.delivery.completed
  delivery:
    queue:
      order:
        created: delivery.queue.order.created
      hub:
        route:
          created: delivery.queue.hub.route.created
    exchange: delivery.exchange
    routing_key:
      order:
        created: delivery.order.created
      hub:
        route:
          created: delivery.hub.route.created
  hub:
    queue:
      route:
        request: hub.queue.hub.route.request
    exchange: hub.exchange
    routing_key:
      delivery:
        route:
          request: hub.delivery.route.request