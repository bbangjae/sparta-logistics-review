spring:
  application:
    name: order-service
  profiles:
    active: local
  config:
    import: "configserver:"
  cloud:
    config:
      discovery:
        enabled: true
        service-id: config-server
  datasource:
    url: jdbc:h2:mem:test
    username: sa
  h2:
    console:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: create



eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE}
    register-with-eureka: true
    fetch-registry: true