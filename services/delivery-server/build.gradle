version = '0.0.1-SNAPSHOT' // ❌ 삭제 (루트에 정의됨)
sourceCompatibility = '17' // ❌ 삭제 (루트에 정의됨)
repositories { ... } // ❌ 삭제 (루트에 정의됨)
