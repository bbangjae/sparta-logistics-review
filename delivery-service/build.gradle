dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
	implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
	compileOnly 'org.projectlombok:lombok'
	// (기존 H2 의존성은 testImplementation으로 변경하거나 삭제)
	// runtimeOnly 'com.h2database:h2' // ⬅️ (주석 처리 또는 삭제)
	testImplementation 'com.h2database:h2' // ⬅️ (테스트 시에만 H2 사용)
	// [추가] PostgreSQL 드라이버
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// 레딧엠큐
	implementation 'org.springframework.boot:spring-boot-starter-amqp'

}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
	// 👇 (나중에) 이 줄을 추가하면 Mockito 경고가 사라집니다.
	jvmArgs("-javaagent:${classpath.find { it.name.contains('byte-buddy-agent') }.path}")
}

tasks.register("prepareKotlinBuildScriptModel"){}