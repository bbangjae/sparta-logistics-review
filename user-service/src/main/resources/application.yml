spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://postgres:5432/p_users   # postgres는 docker-compose 서비스 이름
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update   # 또는 create, create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 9006