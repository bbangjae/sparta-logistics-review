spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://user_postgres:5432/p_users  # docker-compose에서 정의한 postgres 서비스 이름
    username: postgres
    password: admin1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

server:
  port: 9006

logging:
  level:
    root: INFO
    com.sparta.user-service: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
